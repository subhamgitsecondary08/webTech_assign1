<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
</head>

<body>

    <center>
        <h1>Student Registration Form</h1>
    </center>

    <hr>

    <form action="courses.html" method="get">

        <table cellpadding="8">

            <tr>
                <td>Full Name</td>
                <td><input type="text" name="name" required></td>
            </tr>

            <tr>
                <td>Roll Number</td>
                <td>
                    <input type="text" name="roll" placeholder="CSB026" pattern="[A-Z]{3}[0-9]{3}" required>
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="email" required>
                </td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input type="password" required>
                </td>
            </tr>

            <tr>
                <td>Department</td>
                <td>

                    <input list="dept" required>

                    <datalist id="dept">
                        <option value="Computer Science and Engineering">
                        <option value="Electrical Engineering">
                        <option value="Mechanical Engineering">
                        <option value="Civil Engineering">
                        <option value="Electronics and Communication">
                        <option value="Information Technology">
                    </datalist>

                </td>
            </tr>

            <tr>
                <td>Semester</td>
                <td>

                    <select required>

                        <option>Choose Semester</option>
                        <option>1st</option>
                        <option>2nd</option>
                        <option>3rd</option>
                        <option>4th</option>
                        <option>5th</option>
                        <option>6th</option>
                        <option>7th</option>
                        <option>8th</option>

                    </select>

                </td>
            </tr>

            <tr>
                <td>Gender</td>

                <td>

                    <input type="radio" name="g">Male

                    <input type="radio" name="g">Female

                    <input type="radio" name="g">Other

                </td>

            </tr>

            <tr>

                <td>Date of Birth</td>

                <td>

                    <input type="date" min="1998-01-01" max="2010-12-31" required>

                </td>

            </tr>

            <tr>

                <td>Phone Number</td>

                <td>

                    <input type="tel" pattern="[0-9]{10}" required>

                </td>

            </tr>

            <tr>

                <td>Address</td>

                <td>

                    <textarea rows="4" cols="30"></textarea>

                </td>

            </tr>

            <tr>

                <td>Photograph</td>

                <td>

                    <input type="file" required>

                </td>

            </tr>

            <tr>

                <td>Favourite Subjects</td>

                <td>

                    <input type="checkbox"> DBMS

                    <input type="checkbox"> OS

                    <input type="checkbox"> CN

                    <input type="checkbox"> DSA

                </td>

            </tr>

            <tr>

                <td colspan="2" align="center">

                    <input type="submit" value="Register">

                    <input type="reset">

                </td>

            </tr>

        </table>

    </form>

</body>

</html>
